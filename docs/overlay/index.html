<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Nub Chat Pets</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #stage { position: fixed; inset: 0; }
  /* HTML layer for speech bubbles, projected from 3D positions */
  #overlay {
    position: fixed; inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .bubble {
    position: absolute;
    transform: translate(-50%, -100%);
    background: #fffdf7;
    color: #1a1a24;
    padding: 7px 12px 8px;
    border-radius: 14px;
    font-size: 16px;
    line-height: 1.25;
    font-weight: 600;
    max-width: 260px;
    width: max-content;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.28), 0 6px 18px rgba(0, 0, 0, 0.16);
    border: 2px solid rgba(30, 30, 40, 0.85);
  }
  .bubble::after {
    content: "";
    position: absolute;
    left: 50%; bottom: -9px;
    transform: translateX(-50%);
    border: 8px solid transparent;
    border-top-color: #fffdf7;
    border-bottom: none;
  }
  .bubble .who {
    display: inline-block;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.02em;
    background: rgba(20, 16, 40, 0.07);
    border-radius: 999px;
    padding: 1px 8px;
    margin-bottom: 3px;
  }
  .bubble.fade { transition: opacity 0.45s ease; opacity: 0; }
  #hud {
    position: fixed; left: 8px; bottom: 6px;
    color: #fff; font-size: 12px; font-weight: 700;
    text-shadow: 0 1px 3px #000;
    display: none;
    z-index: 10;
  }
  body.debug #hud { display: block; }
  body.debug {
    background: repeating-conic-gradient(#20242c 0% 25%, #2a3038 0% 50%) 0 0 / 48px 48px;
  }
  /* --- mini game UI (all in the transparent overlay layer) --- */
  .game-banner {
    position: absolute;
    left: 50%; top: 4%;
    transform: translate(-50%, 0);
    background: rgba(20, 16, 32, 0.88);
    color: #ffe66d;
    font-size: 22px;
    font-weight: 800;
    padding: 10px 22px;
    border-radius: 14px;
    border: 2px solid rgba(255, 214, 63, 0.7);
    box-shadow: 0 4px 18px rgba(0,0,0,0.5);
    white-space: nowrap;
    z-index: 5;
  }
  .boss-hp {
    position: absolute;
    left: 50%; top: 12%;
    transform: translate(-50%, 0);
    width: min(46vw, 520px);
    height: 18px;
    background: rgba(10, 8, 16, 0.85);
    border: 2px solid rgba(255, 80, 100, 0.85);
    border-radius: 10px;
    overflow: hidden;
    z-index: 5;
  }
  .boss-hp-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(180deg, #ff5f6d, #c81e3c);
    transition: width 0.25s ease;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script>
  // Surface fatal errors on-screen (OBS has no devtools).
  function showFatal(msg) {
    const d = document.createElement("div");
    d.style.cssText =
      "position:fixed;top:0;left:0;right:0;z-index:99;background:#b00020;color:#fff;" +
      "font:12px/1.4 monospace;padding:4px 8px;white-space:pre-wrap";
    d.textContent = msg;
    document.body.appendChild(d);
  }
  window.addEventListener("error", (e) =>
    showFatal("ERROR: " + e.message + "\n" + (e.filename || "") + ":" + e.lineno)
  );
  window.addEventListener("unhandledrejection", (e) =>
    showFatal("REJECTION: " + (e.reason && e.reason.message ? e.reason.message : e.reason))
  );
</script>
</head>
<body>
<div id="stage"></div>
<div id="overlay"></div>
<div id="hud"></div>
<script type="module">
  // Friendly hint instead of a silent blank overlay when no source is configured.
  const q = new URLSearchParams(location.search);
  if (!q.get("mock") && !q.get("channel")) {
    const d = document.createElement("div");
    d.style.cssText =
      "position:fixed;left:0;right:0;bottom:0;z-index:98;background:#17253d;color:#fff;" +
      "font:13px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;text-align:center;padding:12px 16px";
    d.innerHTML =
      'No chat source set — add <b>?channel=yourname</b> (your Twitch channel) or ' +
      '<b>?mock=1</b> (simulated demo) to the URL.';
    document.body.appendChild(d);
  }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
